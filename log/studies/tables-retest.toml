question = "Which of the search switches built for the hand-written leaf help, hurt, or do nothing when the search evaluates with the learned n-tuple tables, measured as seating-corrected swapped pairs at a builder table and a table of searches, and which of them belong in the browser player?"
outcome = "Nine studies, 145 seating-corrected swapped pairs, 74,240 games, every reported outcome matched by recomputation from the archived runs. Bargaining holds under the learned leaf (counters off −0.094 and −0.119, all off −0.165 and −0.098 at the builder table and the table of searches) and the search's information inputs matter more than under the hand-written leaf (four scenarios −0.392, one world −0.109, public-count beliefs −0.143, no proposals −0.172). The quarter-strength hand-written blend improves the tables at both tables (+0.066, +0.064) at 1.4 times the decision time. Eight sampled worlds and the search-ranked opening read positive at the builder table only; every robber, timing, hand, road, prediction, endgame, and planner-weight switch shows no effect that survives both tables."
next_step = "Register a protocol-arena cohort of the quarter blend inside ntuple-leaf's search against ntuple-leaf before any server default changes; if the tables reach the browser, measure the blend's depth reached under the one-second WASM budget. Keep the browser's hand-written configuration unchanged."
