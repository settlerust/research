id = "log/arena-seating"
title = "Why two identical searches in adjacent slots differ"
created = "2026-09-11"
updated = "2026-09-11"
status = "complete"
question = "After asking offer recipients from a rotating seat instead of always the seat after the offerer, do two identical default searches in slots 0 and 1 still differ, and what does the term need?"
outcome = "They still differ, +0.180 (+0.075 to +0.285, run 689a1947), so the recipient order was not the cause. The term is adjacency in turn order, a property of the game: two identical seats with bargain off differ by +0.102 (+0.020 to +0.183), with two identical ETAs beside them by +0.141 (+0.051 to +0.230), with the builders swapped by +0.133 (+0.040 to +0.226), and with an ETA between them (slots 0 and 2) by +0.039 (-0.048 to +0.126); one search with three ETAs leaves the builders within 0.03 of each other. Proposals off (+0.074), counters off (+0.090), and asks off (+0.008) are inconclusive or contradictory one by one; pooled they sit at +0.068 (+0.015 to +0.122), about 0.11 below the default null, so full bargaining doubles a term it does not create. The seat directly before another acts first after three of the four rolls in a round. No arena code changed; docs corrected. Development tier, boards 0 to 63."
next_step = "Keep measuring two-search contrasts as swapped pairs. If the bargaining's share of the term matters for a design, trace which mid-game trades or races the earlier seat wins, on more than 16 boards."
attribution = "Claude Fable 5.1 (claude-fable-5-1) through Claude Code"
