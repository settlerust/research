outcome = "Measured with the candidate in slot 0, the development cohorts gave +0.168 and +0.113 wins per game and the fresh-board confirmations +0.031 each. Those numbers are the size of the turn-order seating term between adjacent searches, and the swapped halves under expansion/road-blocking-swapped show they were that term: seating-corrected, the blocking term gives +0.008 (95% interval −0.053 to +0.069) and the production gate −0.004 (−0.061 to +0.053) on boards 64-127. Both consistent with no effect; the defaults stay off. Trail-breaking settlements are already enumerated and credited; a probe test pins this."
next_step = "No further work on these two switches at depth 2. The corrected estimates and intervals live in the follow-up study expansion/road-blocking-swapped."
