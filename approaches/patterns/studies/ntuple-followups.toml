question = "Does the learned leaf keep its margin against more searches and a symmetric field, which learning settings and window families train best, and does a longer run improve the tables?"
outcome = "The tables hold against more searches (+0.172; symmetric field +0.094). No learning setting or the corner window separates from a 0.2 noise floor; two four-hour runs do not beat the 96,000-game tables on fresh seeds (+0.031, +0.055). Depth 4 under a 4 s budget with a gap rule is inconclusive in the engine for both leaves (+0.078, -0.051) and weaker through the protocol (-0.200, interval below zero), so the baseline stays ntuple-leaf."
next_step = "Read the equal-time depth-4 screen and the gap-rule-only cohort; then change the representation (more window families under a long budget) or the search around the tables rather than train longer."
