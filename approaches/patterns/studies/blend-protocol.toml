id = "patterns/blend-protocol"
title = "The quarter-strength blend through the protocol arena"
created = "2026-09-24"
updated = "2026-09-25"
status = "complete"
question = "Inside ntuple-leaf's exact search (depth 3, 1.5 s, 8 scenarios, 4 worlds, 4 inner scenarios), does the quarter-strength blend of the hand-written terms over the learned tables beat ntuple-leaf through the authoritative HTTP server, measured as a seating-corrected swapped pair on twenty deterministic boards?"
outcome = "Inconclusive. As a swapped pair on seeds 2000-2019 through the protocol arena, ntuple-leaf-blend won 34 of 80 games in half A against 33 for ntuple-leaf (contrast +0.013, -0.156 to +0.181) and 34 of 80 in half B against 32 (-0.025, -0.195 to +0.145, control minus blend); the seating-corrected effect is +0.019 wins per game (95% interval -0.087 to +0.124) and the seating term -0.006, all 160 games valid with no timeout moves. The interval includes zero and the estimate is below +0.03, but it also covers the engine estimate of +0.066, so twenty boards could not separate an effect of that size from nothing. Under the 1.5 s clock on a loaded machine the blend completed depth 3 in about 51% of contested decisions against 61% for the tables alone at 1.1 times the time per decision. The reference stays ntuple-leaf. A first attempt at half A stopped on a seat-join version conflict at game creation (18 valid games, not pooled); the harness join step now retries on conflict."
next_step = "Leave ntuple-leaf as the protocol reference and the server default. Resolving an effect of the engine's size (+0.066) through the protocol needs a pair of about 64-board halves (512 games) on an unloaded machine so the blend keeps its depth; pool with this pair only after the fact and say so. Cheaper first: screen in the engine whether a subset of the hand-written terms buys the same gain without the depth cost."
attribution = "Claude Fable 5.1 (claude-fable-5-1) through Claude Code"
