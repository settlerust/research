question = "Can lookup tables of small board and portfolio patterns, learned from self-play, replace the hand-written leaf of the tunable search and match or beat it at equal depth?"
outcome = "The frozen hex plus portfolio tables beat the hand-written leaf on fresh seeds at every depth tested (equal depth 2: +0.219, 95% interval +0.124 to +0.314; one ply against depth 2: +0.164; depth 2 against depth 3: +0.156; depth 3 against depth 3: +0.242) and won 46 of 80 authoritative games against 25 for expectimax-v2-plan (paired contrast +0.263, +0.094 to +0.431); the protocol baseline is now ntuple-leaf."
next_step = "Vary the learning settings and the window families under a longer budget, read the portfolio tables, speed up feature extraction, and test the tables against a second search seat and negotiating opponents."
