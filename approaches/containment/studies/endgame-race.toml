question = "When an opponent is within two points of victory, does a race leaf, expected hidden victory points, or a late robber and road bias toward the leader change the endgame decisions and the win rate?"
outcome = "Withdrawn as a strength claim. The single-seating cohorts (candidate always in slot 0) measured the arena seating term: +0.129, +0.172, and +0.168 wins per game on seeds 0 to 63 and +0.078, +0.039, and +0.051 on seeds 64 to 127, the size of the measured bias. Swapped pairs under containment/endgame-seating put the seating-corrected effects at +0.018 (95% interval -0.018 to +0.053), +0.006 (-0.030 to +0.041), and +0.012 (-0.018 to +0.041), each crossing zero. No switch is confirmed and the defaults stay unchanged."
next_step = "None for the switches as they stand; any future endgame cohort is registered as a swapped pair from the start."
