question = "Does the search win more games by blocking the points leader, stealing the card this seat needs, or sparing its trade partners, instead of blocking the most pips and robbing the biggest hand?"
outcome = "All three arms beat the default robber shortlist on seeds 0-63 (leader +0.125, need +0.160, threat +0.117 wins per game, each 95% interval excluding zero, 256 games each) and none confirmed on fresh seeds 64-127 (leader +0.035, need +0.039, threat +0.035, all intervals crossing zero). The direction is consistent but unconfirmed, so all three switches stay off by default. The default search lands on the leader's best hex on 25.4% of robber moves; the leader arm raises that to 31.8% and its share of steals from the leader from 42.5% to 55.6%."
next_step = "Test the arms combined (leader hex choice with need-aware victims) on fresh seeds with a larger cohort to resolve effects near +0.04 wins per game, then freeze any survivor for a protocol-arena confirmation before changing a default."
