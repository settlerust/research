question = "Does this change pay off for expectimax-v2 on deterministic paired boards? Removing the plan term that values a build target by its gain over turns-to-afford lowers the win rate."
outcome = "Screen +0.062 then confirmation +0.039 (95% interval -0.021 to +0.099) on 192 fresh seeds: removing the plan term does not hurt at depth 2; the term is redundant once turns are planned."
next_step = "Retest under the depth-3 candidate before removing the term from the leaf; keep it as a documented setting."
