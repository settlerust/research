question = "Does each bargaining mechanism (threat pricing, counters, two-for-one asks, and accepting asks) still win games when the depth-2 search evaluates with the learned n-tuple tables, measured as swapped pairs at a population table and at the builder table?"
outcome = "Swapped pairs under the learned n-tuple leaf, pooled after the fact over 192 seeds: all bargaining off -0.143 wins per game (95% interval -0.180 to -0.106), counters off -0.102 (-0.136 to -0.069), asks off -0.085 (-0.119 to -0.050), threat pricing off +0.001 (-0.035 to +0.036), and the stubborn seat +0.006 (-0.008 to +0.020) over 320 seeds after its extension to seeds 864-927. Counters and all off lose at every stage and asks at both builder-table stages (inconclusive at the population table). Bargaining costs +59% decision time under both leaves, counters +41%, asks +7%, threat pricing +4%. Development tier, depth 2; every switch stays on and no default changes."
next_step = "Measure counters at equal time rather than equal nodes: a swapped pair of the browser configuration (hand-written leaf, depth 3, one-second budget) with counters on and off, to see whether the 40 percent extra time per decision costs depth where the browser spends it."
