title = "Threat-aware pricing, counters, and reasoned declines"
created = "2026-09-11"
updated = "2026-09-11"
status = "complete"
question = "Does pricing every swap by the partner threat, answering thin offers with counters, and declining explicitly change the paired win rate of an otherwise identical depth-2 search?"
outcome = "Two identical defaults in the arm design's slots 0 and 1 differ by +0.176 wins per game (95% interval +0.083 to +0.268, run 91ddb42d), so the +0.219 of run 4228f4f7 is mostly seating: +0.043 (-0.082 to +0.168) against that null. Read the same way, counters off costs -0.199 (-0.309 to -0.089), asks off -0.156 (-0.259 to -0.054), threat pricing off -0.008 (no effect), and a partner that refuses every ask loses nothing by refusing. A swapped pair on fresh boards 64-127 confirms counters at -0.096 (-0.156 to -0.035) for the seat without them, with a seating term of -0.010 there; a second null on boards 64-127 put the seating term at +0.051 (-0.046 to +0.148), so its size varies by board set and every two-search contrast needs both seatings. Development tier at a table of two searches and two builders."
next_step = "A follow-up study: rotate the recipient order of multi-seat offers in the arena, re-measure the null in both seatings, rerun the two-search arms of the ablation program as swapped pairs, and test the bargaining against a partner that counters back."
attribution = "Claude Fable 5.1 (claude-fable-5-1) through Claude Code"
