id = "opening/planner-tables"
title = "The opening planner under the learned leaf"
created = "2026-09-11"
updated = "2026-09-12"
status = "complete"
question = "Does the draft-aware opening planner, calibrated to the hand-written leaf, still match or lose ground against the search ranking the same shortlist with learned site values, and do its calibration weights matter under the tables?"
outcome = "Under the learned-tables leaf, the search-ranked opening (\"opening\":\"search\") beats the default planner against builders: pooled L1 effect +0.061 wins per game (95% interval +0.009 to +0.113) over 192 seeds across three swapped pairs, but the only cohort excluding zero is the development boards 0-63 (+0.135, +0.045 to +0.225), and on the 128 fresh L1 seeds the effect is +0.024 and crosses zero. Against the population lineup the pooled effect is +0.001 (−0.059 to +0.061). The coverage 0.4 / balance 0.5 arm is a null (pooled L1 +0.020, −0.014 to +0.053; pooled L2 +0.004), and removing the scarcity markup is a null (pooled L1 −0.005; L2 −0.012), so both weights stay at their defaults. The search arm costs 25 to 33 percent more mean decision time, concentrated in three or four setup decisions of about 2 s each; it fails the browser rule and the browser keeps the planner, whose hand-leaf comparison was a match anyway."
next_step = "If the server default is to change, register a protocol cohort of the search-ranked opening against the ntuple-leaf baseline, since the engine gain rests on the reused development boards and is zero against search tables; the alternative mechanism is recalibrating the planner's weights to the tables' site values rather than routing placement through the search."
attribution = "GLM-5.3 (baseten/zai-org/GLM-5.3) through OpenCode"
