question = "Does a planner that scores the two setup sites as a portfolio in the leaf currency and predicts the intervening draft picks win more paired games than the search ranking the same shortlist?"
outcome = "Calibrated to the leaf currency the planner beat the previous placement by +0.094 and +0.117 wins per game in two 256-game screens on boards 0-63, and by +0.062 (95% interval -0.036 to +0.161) in the fresh-seed confirmation on boards 64-127: consistent direction, rule not met. Discrete strategies hurt at every strength and stay off. With the planner and threat-aware bargaining together, depth 2 wins 66.4% of slot-games against ETA, fast, and ETA on boards 0-63 (run 42f60c41), against 50.4% for the corrected search before these changes."
next_step = "A larger fresh-seed cohort (128 boards) to settle the contrast, then the same comparison at depth 3 under the browser time budget and against a second search seat that blocks."
