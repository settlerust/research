id = "opening/draft-planner"
title = "Placing the opening with a draft-aware portfolio planner"
created = "2026-09-11"
updated = "2026-09-11"
status = "complete"
question = "Does a planner that scores the two setup sites as a portfolio in the leaf currency and predicts the intervening draft picks win more paired games than the search ranking the same shortlist?"
outcome = "Swapped-seating pairs on 128 boards (runs b698064e, da0b1591, 5e3c4985, d89ea4de): planner effect -0.017 wins per game (95% interval -0.075 to +0.042) after removing a seating term of +0.063; the earlier single-seating gains of +0.06 to +0.12 were seating. The calibrated planner matches the previous placement in strength, and the pip-only first draft lost by 0.30. Discrete strategies hurt at every strength and stay off. With the planner and bargaining together, depth 2 wins 66.4% of slot-games against ETA, fast, and ETA (run 42f60c41)."
next_step = "Test the coverage, balance, and expansion weights against a second search seat that blocks, in swapped pairs, where balanced pairs may matter more than against builders; then the same at depth 3 under the browser budget."
attribution = "Claude Fable 5.1 (claude-fable-5-1) through Claude Code"
