hypothesis = "Swapped-pair half A of knight_play_value on top of the blended leaf (tables plus the hand-written terms at full strength, leaf.hand 1.0 in both seats), development stage (boards 0-63, lineup L1). The switch shapes a hand-written leaf term, which the tables alone ignore, so the arm is measured under the blend. Slot 0 is the candidate: the blend with knight_play_value, valuing played knights by largest-army distance and crediting a held knight with the production it unblocks. Slot 1 is the blend without the switch. Hypothesis: the shaped knight schedule improves the win rate over the flat knight weight under the blend. Half B on the same boards swaps the seats; the seating-corrected effect is the per-seed half-difference of the two contrasts and the seating term their half-sum."
