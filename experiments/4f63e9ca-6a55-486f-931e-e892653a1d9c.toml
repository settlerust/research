id = "4f63e9ca-6a55-486f-931e-e892653a1d9c"
study = "bargaining/threat-aware-pricing"
arena = "engine"
hypothesis = "Threat pricing carries part of the bargaining gain: the depth-2 search without the threat premium on the trade margin and the partner cost (threat_pricing: false) wins fewer paired games than the unchanged default, with an ETA and a fast builder in the other seats."
decision_rule = "All 256 games complete. Primary contrast: slot 0 (the changed seat) minus slot 1 (the unchanged default) wins per seed with a 95% seed interval. A negative interval excluding zero supports the mechanism and keeps it on; a positive interval excluding zero recommends switching it off by default; an interval crossing zero is inconclusive and the default stays. Development tier at a table of two searches and two builders."
players = ["v2:{\"depth\":2,\"threat_pricing\":false}", "v2:{\"depth\":2}", "eta", "fast"]
seeds = "0-63"
rotations = 4
games = 256
points_to_win = 10
max_turns = 500
deterministic = true
