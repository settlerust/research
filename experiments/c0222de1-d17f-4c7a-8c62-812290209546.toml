hypothesis = "Swapped-pair half A for the hidden_points switch, fresh boards: the candidate (endgame hidden_points on the depth-2 search) in slot 0 against the unchanged depth-2 control in slot 1, with an ETA and a fast builder. Combined with half B (control in slot 0, candidate in slot 1) on the same boards and engine, the seating-corrected effect is half the difference of the two per-seed contrasts and the seating term half their sum. Both halves are rerun on the current engine because it no longer reproduces the games of the original confirmations (runs c7b6767b, b8abe69e, bbc86639)."
decision_rule = "Primary contrast: the per-seed half-difference of the two half-cohort contrasts (candidate minus control, averaged over the two seatings) with a 95 percent interval over 64 seeds, computed identically for the pair. Confirmed if the interval excludes zero and the mean reaches +0.05 wins per game; refuted if the upper bound is below zero; inconclusive otherwise. Completion must be 256 of 256 in each half."
