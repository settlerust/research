hypothesis = "Equal deterministic node budget of 83000 transitions per depth pass (one second of WASM at the median sampled position), hand-written leaf, iterative deepening, against the depth-3 control with the same budget. Two scenarios at deeper levels instead of four make the depth-3 pass cheaper, so it completes more often, without losing wins. Half A of a swapped pair (development, seeds 0-63): candidate in slot 0, control in slot 1."
decision_rule = "All games of both halves complete. The seating-corrected effect, half the per-seed difference of the two slot-0-minus-slot-1 win contrasts, has a 95% seed interval that excludes zero in the hypothesized direction (support), excludes zero the other way (refutation), or neither (inconclusive); the seating term is half their sum."
players = ["v2:{\"depth\":3,\"time_budget_ms\":0,\"node_budget\":83000,\"inner_scenarios\":2}", "v2:{\"depth\":3,\"time_budget_ms\":0,\"node_budget\":83000}", "eta", "fast"]
