id = "15173b9c-502e-4e5a-8037-8220bca77707"
study = "containment/robber-targeting"
arena = "engine"
hypothesis = "Seat 0 plays the depth-2 search with robber.leader on: the robber shortlist counts the points leader's blocked pips in full and every other seat's at a tenth, so the shortlist is led by the leader's own best hex. Seats 1-3 are the unchanged depth-2 control, eta, and fast on the same deterministic boards. Prediction: the leader arm wins more games than the control."
decision_rule = "Support if the paired slot-0 minus slot-1 contrast over 64 seeds is positive with its 95% interval excluding zero and all 256 games complete; otherwise keep the default ordering. A supported arm then needs a fresh confirmation on seeds 64-127 before any default change."
players = ["v2:{\"depth\":2,\"robber\":{\"leader\":true}}", "v2:{\"depth\":2}", "eta", "fast"]
seeds = "0-63"
rotations = 4
games = 256
points_to_win = 10
max_turns = 500
deterministic = true
