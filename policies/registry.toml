# Commands are argv arrays, never shell strings. Paths are relative to this repo.
# The runner creates and joins each seat before launching its policy.
[fast]
transport = "remote"
command = ["{server}/target/release/remote", "{base}", "{game}", "fast", "{token_file}", "{name}"]
description = "Existing Rust fast builder with its trading wrapper"

[eta]
transport = "remote"
command = ["{server}/target/release/remote", "{base}", "{game}", "eta", "{token_file}", "{name}"]
description = "Existing Rust estimated-acquisition-time builder with trading"

[legal-first]
transport = "stdio"
command = ["{python}", "policies/legal_first.py"]
description = "Research-owned protocol example; a legality smoke baseline, not a strong strategy"

[liquidity]
transport = "remote"
command = ["{root}/policies/liquidity/target/release/remote", "{base}", "{game}", "liquidity", "{token_file}", "{name}"]
description = "Liquidity study: liquidity, shared Rust runner and frozen baseline source"

[eta-control]
transport = "remote"
command = ["{root}/policies/liquidity/target/release/remote", "{base}", "{game}", "eta", "{token_file}", "{name}"]
description = "Liquidity study: eta, shared Rust runner and frozen baseline source"

[fast-control]
transport = "remote"
command = ["{root}/policies/liquidity/target/release/remote", "{base}", "{game}", "fast", "{token_file}", "{name}"]
description = "Liquidity study: fast, shared Rust runner and frozen baseline source"

[expectimax-v1]
transport = "remote"
command = ["{server}/target/release/remote", "{base}", "{game}", "v1", "{token_file}", "{name}"]
description = "Frozen reference expectimax (server crates/expectimax, default config)"

[expectimax-v2]
transport = "remote"
command = ["{server}/target/release/remote", "{base}", "{game}", "v2", "{token_file}", "{name}"]
description = "Tunable expectimax-v2 at its default configuration (server crates/expectimax/src/v2)"

[expectimax-v2-deep]
transport = "remote"
command = ["{server}/target/release/remote", "{base}", "{game}", "v2:{{\"depth\":3,\"time_budget_ms\":1500,\"samples\":8,\"scenarios\":16,\"inner_scenarios\":4,\"beam\":4,\"afterstates\":96}}", "{token_file}", "{name}"]
description = "expectimax-v2 candidate: depth 3, 1.5 s budget, 16 scenarios, 8 sampled worlds (frozen 2026-09-08); braces are doubled for the harness placeholder syntax"

[expectimax-v2-plan]
transport = "remote"
command = ["{server}/target/release/remote", "{base}", "{game}", "v2:{{\"depth\":3,\"time_budget_ms\":1500,\"samples\":4,\"scenarios\":8,\"inner_scenarios\":4}}", "{token_file}", "{name}"]
description = "expectimax-v2 after the turn-planning fix: depth 3, 1.5 s budget, 8 scenarios, 4 sampled worlds (frozen 2026-09-09); braces are doubled for the harness placeholder syntax"

[expectimax-v2-hand-risk]
transport = "remote"
command = ["{server}/target/release/remote", "{base}", "{game}", "v2:{{\"depth\":2,\"spend_down\":true,\"discard_projection\":true}}", "{token_file}", "{name}"]
description = "Hand-management study (risk/hand-management) smoke candidate: depth 2 with spend-down candidates and projected discard ranking; braces are doubled for the harness placeholder syntax"

[ntuple-leaf]
transport = "remote"
command = ["{server}/target/release/remote", "{base}", "{game}", "v2:{{\"depth\":3,\"time_budget_ms\":1500,\"samples\":4,\"scenarios\":8,\"inner_scenarios\":4,\"leaf\":{{\"tables\":\"{root}/artifacts/ntuple/hex-portfolio-main.bin\"}}}}", "{token_file}", "{name}"]
description = "expectimax-v2-plan's search (depth 3, 1.5 s, 8 scenarios, 4 worlds) with the learned hex + portfolio n-tuple tables as its leaf (frozen 2026-09-09 from the main training run); braces are doubled for the harness placeholder syntax"

[ntuple-leaf-deep]
transport = "remote"
command = ["{server}/target/release/remote", "{base}", "{game}", "v2:{{\"depth\":4,\"time_budget_ms\":4000,\"node_budget\":5000000,\"deepen_gap\":20,\"samples\":4,\"scenarios\":8,\"inner_scenarios\":4,\"leaf\":{{\"tables\":\"{root}/artifacts/ntuple/hex-portfolio-main.bin\"}}}}", "{token_file}", "{name}"]
description = "ntuple-leaf's search with a depth cap of 4 under a 4 s budget, a 5,000,000-transition node budget, and decision-aware deepening (gap 20 leaf units); lost its protocol cohort against ntuple-leaf on 2026-09-09 and is not the baseline; braces are doubled for the harness placeholder syntax"

[ntuple-leaf-tt]
transport = "remote"
command = ["{server}/target/release/remote", "{base}", "{game}", "v2:{{\"depth\":3,\"time_budget_ms\":1500,\"samples\":4,\"scenarios\":8,\"inner_scenarios\":4,\"cache\":\"turn\",\"leaf\":{{\"tables\":\"{root}/artifacts/ntuple/hex-portfolio-main.bin\"}}}}", "{token_file}", "{name}"]
description = "ntuple-leaf with transposition tables kept across the decisions of a turn (cache: turn); protocol cohort against ntuple-leaf inconclusive on 2026-09-09 (27 to 36), not the baseline; braces are doubled for the harness placeholder syntax"
